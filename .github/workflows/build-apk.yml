name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://znyvmlwggwckjxxsxiwq.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueXZtbHdnZ3dja2p4eHN4aXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTE0NjUsImV4cCI6MjEwNTA2NzQ2NX0._NNVeLFW1OvXnTGYZbCcEmd4eYSF2J8g5Zxi6T4kdqY"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SahebPaper-Beta-1.10.6.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk SahebPaper-Latest.apk

      - name: Upload to Supabase Storage
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const fs = require('fs');
          const supabase = createClient('https://znyvmlwggwckjxxsxiwq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueXZtbHdnZ3dja2p4eHN4aXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTE0NjUsImV4cCI6MjEwNTA2NzQ2NX0._NNVeLFW1OvXnTGYZbCcEmd4eYSF2J8g5Zxi6T4kdqY');
          async function upload() {
            const fileBuf = fs.readFileSync('SahebPaper-Beta-1.10.6.apk');
            const { data, error } = await supabase.storage.from('documents').upload('SahebPaper-Beta-1.10.6.apk', fileBuf, { upsert: true, contentType: 'application/vnd.android.package-archive' });
            if (error) console.error('Supabase upload error:', error);
            else console.log('Successfully uploaded SahebPaper-Beta-1.10.6.apk to Supabase:', data);
            
            const { data: d2, error: e2 } = await supabase.storage.from('documents').upload('SahebPaper-Latest.apk', fileBuf, { upsert: true, contentType: 'application/vnd.android.package-archive' });
            if (e2) console.error('Supabase Latest upload error:', e2);
            else console.log('Successfully uploaded SahebPaper-Latest.apk to Supabase:', d2);
          }
          upload();
          "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahebPaper-Beta-1.10.6-APK
          path: SahebPaper-Beta-1.10.6.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.6
          name: "Saheb Paper ERP (Beta 1.10.6) Exact Preview PDF Layout"
          files: |
            SahebPaper-Beta-1.10.6.apk
            SahebPaper-Latest.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
