name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. Beta 1.10.30)'
        required: false
        default: 'Beta 1.10.30'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://znyvmlwggwckjxxsxiwq.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueXZtbHdnZ3dja2p4eHN4aXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTE0NjUsImV4cCI6MjEwNTA2NzQ2NX0._NNVeLFW1OvXnTGYZbCcEmd4eYSF2J8g5Zxi6T4kdqY"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2048m"

      - name: Prepare APKs for release
        run: |
          VERSION="${{ github.event.inputs.version_name || 'Beta 1.10.30' }}"
          SAFE_VERSION=$(echo "$VERSION" | tr ' ' '-')
          cp android/app/build/outputs/apk/debug/app-debug.apk "Saheb-Paper-ERP-${SAFE_VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "SahebPaper-Latest.apk"
          echo "APK_NAME=Saheb-Paper-ERP-${SAFE_VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION_TAG=${SAFE_VERSION}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saheb-Paper-ERP-${{ env.VERSION_TAG }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.30
          name: "Saheb Paper ERP — Beta 1.10.30 APK (OTA Bridge)"
          body: |
            ## 📱 Saheb Paper ERP — Beta 1.10.30

            ### Download & Install
            1. Download `SahebPaper-Latest.apk` or `${{ env.APK_NAME }}` below
            2. Install the APK on your Android device (OnePlus / all Android phones)

            ### Key Highlights
            - ✅ **Native OTA Live Bridge**: Directly loads live cloud deployment (`https://thakordhruv097-spec.github.io/saheb-paper/`)
            - ✅ **Customer / Party Name Direct Typing**: Directly type any customer/party name on draft packing slips
            - ✅ **Permanent OTA Updates**: After this single install, all future web deployments update seamlessly in-app without needing to reinstall the APK!
          files: |
            ${{ env.APK_NAME }}
            SahebPaper-Latest.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
