name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. Beta 1.10.23)'
        required: false
        default: 'Beta 1.10.22'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://znyvmlwggwckjxxsxiwq.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueXZtbHdnZ3dja2p4eHN4aXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTE0NjUsImV4cCI6MjEwNTA2NzQ2NX0._NNVeLFW1OvXnTGYZbCcEmd4eYSF2J8g5Zxi6T4kdqY"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2048m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saheb-Paper-ERP-${{ github.event.inputs.version_name || 'Beta-1.10.22' }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK for release
        run: |
          VERSION="${{ github.event.inputs.version_name || 'Beta 1.10.22' }}"
          SAFE_VERSION=$(echo "$VERSION" | tr ' ' '-')
          cp android/app/build/outputs/apk/debug/app-debug.apk "Saheb-Paper-ERP-${SAFE_VERSION}.apk"
          echo "APK_NAME=Saheb-Paper-ERP-${SAFE_VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION_TAG=${SAFE_VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION_TAG }}
          name: "Saheb Paper ERP — ${{ github.event.inputs.version_name || 'Beta 1.10.22' }} APK"
          body: |
            ## 📱 Saheb Paper ERP — ${{ github.event.inputs.version_name || 'Beta 1.10.22' }}

            ### Download & Install
            1. Download `${{ env.APK_NAME }}` below
            2. Transfer to your Android phone
            3. Enable "Install from unknown sources" in Android Settings
            4. Install the APK

            ### What's New
            - ✅ Party name: type directly in the input box
            - ✅ Select existing party from "List ▾" dropdown
            - ✅ OTA live updates — no reinstall needed for future updates
            - ✅ All features now visible on both mobile APK and browser

            > After installing this APK, all future updates will apply automatically via OTA (no reinstall needed).
          files: ${{ env.APK_NAME }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
