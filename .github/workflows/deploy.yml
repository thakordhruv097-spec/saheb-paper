name: Deploy to GitHub Pages & Release Applications

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: "https://znyvmlwggwckjxxsxiwq.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueXZtbHdnZ3dja2p4eHN4aXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTE0NjUsImV4cCI6MjEwNTA2NzQ2NX0._NNVeLFW1OvXnTGYZbCcEmd4eYSF2J8g5Zxi6T4kdqY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: "https://znyvmlwggwckjxxsxiwq.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueXZtbHdnZ3dja2p4eHN4aXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTE0NjUsImV4cCI6MjEwNTA2NzQ2NX0._NNVeLFW1OvXnTGYZbCcEmd4eYSF2J8g5Zxi6T4kdqY"
      - run: npx cap sync android
      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SahebPaper-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SahebPaper-Android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: "https://znyvmlwggwckjxxsxiwq.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueXZtbHdnZ3dja2p4eHN4aXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTE0NjUsImV4cCI6MjEwNTA2NzQ2NX0._NNVeLFW1OvXnTGYZbCcEmd4eYSF2J8g5Zxi6T4kdqY"
      - run: npm run electron:build
      - name: Rename Windows Executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "SahebPaper*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "SahebPaper-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: SahebPaper-Windows.exe

  release:
    needs: [build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "Saheb Paper ERP v1.3.0"
          body: |
            ## Saheb Paper ERP — Official Applications (v1.3.0)

            ### 💻 Windows Desktop Application
            - **Download**: [SahebPaper-Windows.exe](https://github.com/thakordhruv097-spec/saheb-paper/releases/download/v1.3.0/SahebPaper-Windows.exe)
            - Portable executable — run directly without installation on Windows 10/11.

            ### 📱 Android Mobile Application
            - **Download**: [SahebPaper-Android.apk](https://github.com/thakordhruv097-spec/saheb-paper/releases/download/v1.3.0/SahebPaper-Android.apk)
            - Standalone APK for Android phones and barcode scanning tablets.

            ### 🌐 Web ERP
            - **Live Link**: https://thakordhruv097-spec.github.io/saheb-paper/
          files: |
            SahebPaper-Windows.exe
            SahebPaper-Android.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
