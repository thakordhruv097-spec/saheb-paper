<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#6C4FE0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Saheb Paper ERP — Next-generation cloud ERP for paper mill manufacturing, inventory management, reel tracking, quality lab test reports, and dispatch telemetry." />
    <link rel="canonical" href="https://thakordhruv097-spec.github.io/saheb-paper/" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Saheb Paper ERP — Industrial Mill Management</title>
    
    <!-- Preconnect & Fonts with display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Preload Critical Login Visual Assets -->
    <link rel="preload" as="image" href="./login_paper_rolls_bg.webp" type="image/webp" />
    <link rel="preload" as="image" href="./logo.webp" type="image/webp" />

    <script>
      (function() {
        try {
          var stored = localStorage.getItem('saheb_theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans bg-bg-light dark:bg-bg-dark text-text-light-primary dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
